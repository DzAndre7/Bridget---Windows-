name: Safety tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/test.txt
      - run: python -m pytest -c pytest-safety.ini -q --durations=10
        timeout-minutes: 3
      - run: python -m ruff check asistente_v2/core/sandbox.py asistente_v2/core/sandbox_backends asistente_v2/core/auto_mejora.py asistente_v2/tests/test_sandbox.py asistente_v2/tests/test_sandbox_security.py asistente_v2/tests/test_requirements_windows.py asistente_v2/tests/test_voice_device.py asistente_v2/tests/test_qemu_protocol.py asistente_v2/tests/test_qemu_bundle.py asistente_v2/tests/test_qemu_controller.py asistente_v2/tests/test_windows_job.py guest/qemu/agent.py
