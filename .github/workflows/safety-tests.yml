name: Safety tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/test.txt
      - run: python -m pytest -c pytest-safety.ini -q --durations=10
        timeout-minutes: 3
      - run: python -m ruff check asistente_v2/core/sandbox.py asistente_v2/core/sandbox_backends asistente_v2/core/auto_mejora.py asistente_v2/tests/test_sandbox.py asistente_v2/tests/test_sandbox_security.py asistente_v2/tests/test_requirements_windows.py asistente_v2/tests/test_voice_device.py asistente_v2/tests/test_qemu_protocol.py asistente_v2/tests/test_qemu_bundle.py asistente_v2/tests/test_qemu_controller.py asistente_v2/tests/test_windows_job.py guest/qemu/agent.py asistente_v2/core/runtime_paths.py asistente_v2/core/local_models.py asistente_v2/core/windows_native.py asistente_v2/core/audio_io.py asistente_v2/core/app_permissions.py asistente_v2/core/notifications.py asistente_v2/core/storage.py asistente_v2/core/voice.py asistente_v2/core/listen.py asistente_v2/core/memoria_semantica.py asistente_v2/core/cerebro.py asistente_v2/core/microfono_ventana.py asistente_v2/core/manos_libres.py asistente_v2/core/diagnostics.py asistente_v2/core/memory.py asistente_v2/core/preferences.py asistente_v2/actions scripts asistente_v2/tests/test_platform_runtime.py asistente_v2/tests/test_models_storage_windows.py asistente_v2/tests/test_audio_portable.py

  install-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked text profile and run synthetic smoke
        shell: pwsh
        run: ./scripts/install-windows.ps1 -Profile Text -EnvironmentPath (Join-Path $env:RUNNER_TEMP 'bridget-text')
      - name: Install locked voice profile and optional GUI; run smoke
        shell: pwsh
        run: ./scripts/install-windows.ps1 -Profile Desktop
      - name: Import native components without activating hardware or downloading models
        run: .venv/Scripts/python.exe -c "import sounddevice, scipy, faster_whisper, webrtcvad, webview; print('Native imports OK')"
      - name: Check diagnostic without services or hardware
        run: .venv/Scripts/python.exe scripts/diagnose.py --json --strict
